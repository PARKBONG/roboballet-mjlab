[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboballet-mjlab"
version = "0.1.0"
description = "RoboBallet ported to mjlab: the original's TD3, FastTD3, SAC and PPO on GPU-batched multi-arm reaching."
license = "Apache-2.0"
readme = "README.md"
license-files = ["LICENSE", "NOTICE", "third_party/*/LICENSE", "third_party/*/*/LICENSE"]
requires-python = ">=3.12,<3.13"
# Pinned to the environment every result in docs/ was measured in.
dependencies = [
  "mjlab==1.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.19.0",
  "torch==2.15.0",
  "rsl-rl-lib==5.4.2",
  "tensordict==0.15.4",
  "numpy==2.5.4",
  "protobuf==7.36.2",
  "psutil==7.2.2",
  "tensorboard==2.21.0",
  "matplotlib==3.11.2",
  "mediapy==1.2.7",
  "pillow==13.0.0",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
# Only --wandb-project uses it. mjlab 1.6.0 itself requires wandb, so it is installed either way.
wandb = ["wandb==0.31.0"]

[dependency-groups]
# The tests on branch test. pytest as development used it.
dev = ["pytest==9.2.0"]

[project.scripts]
# mjlab 1.6.0 installs its own train and play into the same environment, and they cannot run this
# env (mjlab/scripts/train.py:110 builds a ManagerBasedRlEnv), so ours carry a prefix.
ballet-train = "roboballet_mjlab.cli.train:main"
ballet-play = "roboballet_mjlab.cli.play:main"
ballet-eval = "roboballet_mjlab.cli.eval:main"
ballet-fetch-data = "roboballet_mjlab.scripts.fetch_data:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roboballet_mjlab"]

[tool.uv]
# mujoco-warp and warp run on Linux with CUDA, and every result was measured on x86-64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Indirect dependencies whose newer releases a fresh resolve would take: held at the versions the
# results were measured with. Every other package resolves to that environment's version as it is.
constraint-dependencies = [
  "cuda-bindings==13.4.4",
  "nvidia-cuda-cccl==13.3.4.3.1",
  "nvidia-nvjitlink==13.4.92",
  "filelock==4.2.8",
  "markdown==3.11.2",
  "platformdirs==4.14.4",
  "pydantic==2.14.2",
  "pydantic-core==2.50.2",
  "typing-inspection==0.4.4",
]

# torch 2.15.0 came from PyPI: its Linux x86-64 wheel is the CUDA 13.2 build (torch.version.cuda 13.2,
# torch.__version__ 2.15.0+cu132, the cuda-toolkit 13.2.2 and nvidia-*-cu13 wheels beside it). Named
# here so that an index set elsewhere, a PyTorch one with +cu or +cpu builds among them, cannot replace it.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
torch = { index = "pypi" }
